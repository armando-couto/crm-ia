server {
    listen 7894;
    listen [::]:7894;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "public, max-age=300" always; }
    gzip on; gzip_vary on; gzip_min_length 1024; gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
