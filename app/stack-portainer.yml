version: "3"
services:
  app:
    container_name: crm-ia
    image: crmia/app:latest
    restart: always
    # Porta publicada e interna iguais: o binário escuta em port_server=3483
    # (definido no .env.production), então o ingress do Swarm entrega na 3483.
    ports:
      - "3483:3483"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ip-172-31-62-162  # força nessa máquina No1