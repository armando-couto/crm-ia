# Ambiente local de desenvolvimento.
# Em produção roda apenas o container do CRM IA (o PostgreSQL fica em outro servidor).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crmia
      POSTGRES_USER: crmia
      POSTGRES_PASSWORD: crmia
    ports:
      - '5432:5432'
    volumes:
      - crmia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crmia -d crmia']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      # Porta de desenvolvimento (defina port_server=6998 no seu .env.production local)
      - '6998:6998'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env.production:/app/.env.production:ro

volumes:
  crmia_pgdata:
