name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  go:
    name: Go (app, painel, provisioner)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        modulo: [app, painel, provisioner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.modulo }}/go.mod
          cache-dependency-path: ${{ matrix.modulo }}/go.sum
      - name: gofmt
        working-directory: ${{ matrix.modulo }}
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: ${{ matrix.modulo }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.modulo }}
        env:
          CRMIA_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          CRMIA_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race ./...

  web:
    name: Frontend (${{ matrix.pasta }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pasta: [app/web, landing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pasta }}/package-lock.json
      - working-directory: ${{ matrix.pasta }}
        run: npm ci
      - working-directory: ${{ matrix.pasta }}
        run: npm run typecheck
      - working-directory: ${{ matrix.pasta }}
        run: npm test
      - working-directory: ${{ matrix.pasta }}
        run: npm run build

  imagens:
    name: Imagens Docker (só constrói)
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: compose válido
        run: |
          cp .env.example .env
          sed -i 's/^PAINEL_DB_PASSWORD=.*/PAINEL_DB_PASSWORD=x/;s/^PAINEL_SESSION_KEY=.*/PAINEL_SESSION_KEY=x/;s/^PAINEL_CSRF_KEY=.*/PAINEL_CSRF_KEY=x/;s/^PROVISIONER_TOKEN=.*/PROVISIONER_TOKEN=x/;s/^PGHOST=.*/PGHOST=postgres/' .env
          docker compose config -q
      - uses: docker/build-push-action@v6
        with: { context: ./app, push: false, build-args: VERSAO=ci }
      - uses: docker/build-push-action@v6
        with: { context: ./painel, push: false }
      - uses: docker/build-push-action@v6
        with: { context: ./provisioner, push: false }
      - uses: docker/build-push-action@v6
        with: { context: ./landing, push: false }
      - uses: docker/build-push-action@v6
        with: { context: ./infra/suspenso, push: false }
