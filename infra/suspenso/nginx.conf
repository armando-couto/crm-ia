server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    location = /healthz { return 200 "ok\n"; }
    # 402 Payment Required em qualquer rota: o ambiente existe, só a
    # assinatura não está ativa.
    location / { error_page 402 /index.html; return 402; }
    location = /index.html { internal; }
}
