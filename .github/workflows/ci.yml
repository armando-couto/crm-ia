name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  backend:
    name: Testes do Backend (Go)
    runs-on: ubuntu-latest

    # Postgres descartavel para os testes de integracao (mesclagem, automacoes).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fixcrm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Testes
        env:
          FIXCRM_TEST_DSN: postgres://postgres:postgres@localhost:5432/fixcrm_test?sslmode=disable
        run: go test ./... -count=1

  frontend:
    name: Testes do Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
