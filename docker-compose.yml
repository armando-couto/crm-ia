# =============================================================================
# CRM IA — stack da plataforma
#
#   traefik      TLS (Let's Encrypt) e roteamento por caminho
#   landing      site comercial                https://$DOMAIN/
#   painel       painel administrativo (Go)    https://$DOMAIN/painel
#   provisioner  sobe/atualiza/suspende os ambientes dos clientes (rede interna)
#
# Os ambientes dos clientes NÃO ficam aqui: cada um é uma stack própria
# (PostgreSQL + Redis + app), gerada em tempo de execução pelo provisionador a
# partir de infra/tenant/docker-compose.tenant.tmpl.
# =============================================================================
name: crmia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7
    container_name: crmia-traefik
    restart: unless-stopped
    logging: *logging
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.filters.statuscodes=400-599
      - --api.dashboard=false
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=10m
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=crmia_public
      - --providers.docker.constraints=Label(`crmia.roteado`,`sim`) || LabelRegex(`crmia.tenant`,`.+`)
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?defina ACME_EMAIL no .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt
    networks: [public]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 5s
      retries: 3

  landing:
    build:
      context: ./landing
      args:
        DOMINIO: ${DOMAIN}
        EMAIL_COMERCIAL: ${EMAIL_COMERCIAL:-contato@crmia.com.br}
        WHATSAPP: ${WHATSAPP_COMERCIAL:-}
    image: crmia/landing:latest
    container_name: crmia-landing
    restart: unless-stopped
    logging: *logging
    environment:
      DOMINIO: ${DOMAIN}
    networks: [public]
    labels:
      - traefik.enable=true
      - crmia.roteado=sim
      - traefik.docker.network=crmia_public
      - traefik.http.routers.ci-landing.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.ci-landing.entrypoints=websecure
      - traefik.http.routers.ci-landing.priority=1
      - traefik.http.routers.ci-landing.middlewares=chain-publico@file
      - traefik.http.services.ci-landing.loadbalancer.server.port=7894

  painel:
    build:
      context: ./painel
    image: crmia/painel:latest
    container_name: crmia-painel
    restart: unless-stopped
    logging: *logging
    environment:
      APP_ENV: ${APP_ENV:-production}
      BASE_PATH: /painel
      DOMAIN: ${DOMAIN}
      NOME_PRODUTO: ${NOME_PRODUTO:-CRM IA}
      EMAIL_COMERCIAL: ${EMAIL_COMERCIAL:-contato@crmia.com.br}
      DATABASE_URL: postgres://${PAINEL_DB_USER:-crmia_painel}:${PAINEL_DB_PASSWORD:?defina PAINEL_DB_PASSWORD}@${PGHOST:?defina PGHOST}:${PGPORT:-5432}/${PAINEL_DB_NAME:-crmia_painel}?sslmode=${PGSSLMODE:-require}
      SESSION_KEY: ${PAINEL_SESSION_KEY:?defina PAINEL_SESSION_KEY}
      CSRF_KEY: ${PAINEL_CSRF_KEY:?defina PAINEL_CSRF_KEY}
      ADMIN_EMAIL: ${PAINEL_ADMIN_EMAIL}
      ADMIN_SENHA: ${PAINEL_ADMIN_SENHA}
      DIAS_ATRASO_SUSPENSAO: ${DIAS_ATRASO_SUSPENSAO:-10}
      PROVISIONER_URL: http://provisioner:7898
      PROVISIONER_TOKEN: ${PROVISIONER_TOKEN:?defina PROVISIONER_TOKEN}
      # Cobrança recorrente das licenças (credenciais da PRÓPRIA CRM IA; o
      # cliente final nunca as vê).
      FIXPAY_TOKEN_API: ${FIXPAY_TOKEN_API}
      FIXPAY_APIS_URL: ${FIXPAY_APIS_URL:-https://apis.fixpay.com.br}
      FIXPAY_SIGN_URL: ${FIXPAY_SIGN_URL:-https://signpayments.fixpay.com.br}
      FIXPAY_SIGN_GRUPO_ID: ${FIXPAY_SIGN_GRUPO_ID:-0}
      FIXPAY_SIMULADO: ${FIXPAY_SIMULADO:-false}
      MANDRILL_API_KEY: ${MANDRILL_API_KEY}
      MANDRILL_FROM_EMAIL: ${MANDRILL_FROM_EMAIL:-nao-responda@crmia.com.br}
      MANDRILL_FROM_NOME: ${MANDRILL_FROM_NOME:-CRM IA}
    networks: [public, interna]
    labels:
      - traefik.enable=true
      - crmia.roteado=sim
      - traefik.docker.network=crmia_public
      - traefik.http.routers.ci-painel.rule=Host(`${DOMAIN}`) && PathPrefix(`/painel`)
      - traefik.http.routers.ci-painel.entrypoints=websecure
      - traefik.http.routers.ci-painel.priority=40
      - traefik.http.routers.ci-painel.middlewares=chain-painel@file
      - traefik.http.services.ci-painel.loadbalancer.server.port=7894
    healthcheck:
      test: ["CMD", "/painel", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  provisioner:
    build:
      context: ./provisioner
    image: crmia/provisioner:latest
    container_name: crmia-provisioner
    restart: unless-stopped
    logging: *logging
    environment:
      APP_ENV: ${APP_ENV:-production}
      DOMAIN: ${DOMAIN}
      PORT: "7898"
      PROVISIONER_TOKEN: ${PROVISIONER_TOKEN:?defina PROVISIONER_TOKEN}
      TENANTS_DIR: /tenants
      TEMPLATE_PATH: /templates/docker-compose.tenant.tmpl
      BACKUPS_DIR: /backups
      REDE_PUBLICA: crmia_public
      TENANT_IMAGE_APP: ${TENANT_IMAGE_APP:-crmia/app}
      TENANT_IMAGE_DB: ${TENANT_IMAGE_DB:-postgres:16-alpine}
      TENANT_IMAGE_REDIS: ${TENANT_IMAGE_REDIS:-redis:7-alpine}
      TENANT_IMAGE_SUSPENSO: ${TENANT_IMAGE_SUSPENSO:-crmia/suspenso:latest}
      TENANT_VERSAO_PADRAO: ${TENANT_VERSAO_PADRAO:-latest}
      TENANT_CPU_LIMIT: ${TENANT_CPU_LIMIT:-1.0}
      TENANT_MEM_LIMIT: ${TENANT_MEM_LIMIT:-768m}
      TENANT_DB_MEM_LIMIT: ${TENANT_DB_MEM_LIMIT:-512m}
      TENANT_REDIS_MEM_LIMIT: ${TENANT_REDIS_MEM_LIMIT:-128m}
      REGISTRY_USER: ${REGISTRY_USER:-}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
      PAINEL_URL: http://painel:7894/painel
      MANDRILL_API_KEY: ${MANDRILL_API_KEY}
      MANDRILL_FROM_EMAIL: ${MANDRILL_FROM_EMAIL:-nao-responda@crmia.com.br}
      MANDRILL_FROM_NOME: ${MANDRILL_FROM_NOME:-CRM IA}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/tenant:/templates:ro
      - tenants-config:/tenants
      - backups:/backups
    networks: [interna, public]
    healthcheck:
      test: ["CMD", "/provisioner", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  public:
    name: crmia_public
  interna:
    name: crmia_interna
    internal: true

volumes:
  traefik-acme:
    name: crmia_traefik_acme
  tenants-config:
    name: crmia_tenants_config
  backups:
    name: crmia_backups
